[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-memory-system"
version = "0.1.0"
description = "Persistent structured memory for meetings and person-specific follow-ups"
requires-python = ">=3.10"
authors = [{name = "Valon Jang"}]
license = {text = "MIT"}

[project.scripts]
meeting-memory = "meeting_memory_system.cli:main"

[tool.setuptools]
packages = ["meeting_memory_system"]
